<!doctype html>
<!-- re_invent interview report. One file: styles, renderer and data.
     Fill: replace null in the report-data script tag with {"turns": [...], "report": {...}}.
     scripts/build_report.py does this after it validates the data. Format: references/data-format.md. -->
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#fefdfc;--fg:#2a3139;--muted:#5f646a;--line:#dee2e5;--card:#ffffff;--soft:#f5f7f9;--warm:#fff2eb;--accent:#be4400;--m:#0d1c42;--l:#be4400;
--job:#4d6b04;--job-bg:#f2f8e4;--pain:#c50710;--pain-bg:#fde9e7;--workaround:#946200;--workaround-bg:#fbf1d9;
--play-good:#0052ed;--play-good-bg:#e6eefe;--play-distort:#7a2fc2;--play-distort-bg:#f2e8fc;--signal:#007a6c;--signal-bg:#def3ef;--play-missed:#b0124f;--play-missed-bg:#fce6ee;}
.problems{margin:16px 0;padding:12px 16px;border-left:4px solid var(--pain);background:var(--pain-bg);font-size:14px}
.problems ul{margin:6px 0 0;padding-left:20px}
.empty{padding:48px 16px;max-width:65ch}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c2127;--fg:#f3f1eb;--muted:#a9afb5;--line:#3a424b;--card:#2a3139;--soft:#252b32;--warm:#3a2a22;--accent:#f08a4b;--m:#a9c2ff;--l:#f08a4b;
--job:#b5d36a;--job-bg:#2b3417;--pain:#ff7a72;--pain-bg:#43201e;--workaround:#e7b75a;--workaround-bg:#3b3015;
--play-good:#7ea6ff;--play-good-bg:#1d2a47;--play-distort:#c79bf2;--play-distort-bg:#33243f;--signal:#6fd0c2;--signal-bg:#163531;--play-missed:#f48fb1;--play-missed-bg:#3d1a2a;}}
:root[data-theme="dark"]{--bg:#1c2127;--fg:#f3f1eb;--muted:#a9afb5;--line:#3a424b;--card:#2a3139;--soft:#252b32;--warm:#3a2a22;--accent:#f08a4b;--m:#a9c2ff;--l:#f08a4b;
--job:#b5d36a;--job-bg:#2b3417;--pain:#ff7a72;--pain-bg:#43201e;--workaround:#e7b75a;--workaround-bg:#3b3015;
--play-good:#7ea6ff;--play-good-bg:#1d2a47;--play-distort:#c79bf2;--play-distort-bg:#33243f;--signal:#6fd0c2;--signal-bg:#163531;--play-missed:#f48fb1;--play-missed-bg:#3d1a2a;}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
[data-type="job"]{--c:var(--job);--cb:var(--job-bg)}[data-type="pain"]{--c:var(--pain);--cb:var(--pain-bg)}
[data-type="workaround"]{--c:var(--workaround);--cb:var(--workaround-bg)}[data-type="play-good"]{--c:var(--play-good);--cb:var(--play-good-bg)}
[data-type="play-distort"]{--c:var(--play-distort);--cb:var(--play-distort-bg)}[data-type="signal"]{--c:var(--signal);--cb:var(--signal-bg)}[data-type="play-missed"]{--c:var(--play-missed);--cb:var(--play-missed-bg)}
header.top{padding:44px 0 24px}
.serif,h1.title,h2.lead,.chunk h2,.grp h3,.hyp h3,.part>.chunk-head h2{font-family:Oswald,"Arial Narrow",Inter,ui-sans-serif,sans-serif;font-weight:600;letter-spacing:-.025em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1.title{font-size:48px;line-height:1.1;margin:8px 0 12px}
.sub{margin:0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sub a{color:var(--fg)}
h2.lead{font-size:30px;line-height:1.2;margin:32px 0 16px;max-width:50ch}
h3.sect{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:48px 0 12px;font-weight:700}
.points{margin:0 0 32px;padding-left:20px;max-width:65ch}.points li{margin:8px 0;padding-left:4px}
.points li::marker{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:900px;margin:0}
.stat{border-top:3px solid var(--c);background:var(--soft);border-radius:0;padding:12px;display:flex;flex-direction:column;gap:4px}
.stat.zero{--c:var(--line)}.stat.zero b{color:var(--muted)}
.stat b{font-size:24px;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
details.box{border-radius:0;background:var(--soft);margin:16px 0;padding:0 16px}
details.box>summary{cursor:pointer;padding:12px 0;font-weight:600}
.toc{margin:0 0 16px;padding-left:28px;max-width:75ch}.toc li{margin:8px 0;padding-left:4px}.toc li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.toc a{text-decoration:none}.toc a:hover{text-decoration:underline}
.toc-ts{display:inline-block;min-width:6em;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px 24px;padding-bottom:16px}
.ix-col h3{font-size:16px;margin:12px 0 4px;color:var(--c);display:flex;align-items:center;gap:8px}
.ix-col ul{margin:0;padding-left:18px;font-size:14px}.ix-col li{margin:4px 0}.ix-col a{text-decoration:none}.ix-col a:hover{text-decoration:underline}
.ix-t{color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding-top:10px;padding-bottom:10px}
.bar .lbl{font-size:14px;color:var(--muted);margin-right:4px}
.filter{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--c);color:var(--c);background:var(--cb);border-radius:2px;padding:3px 10px;cursor:pointer;user-select:none}
.filter input{display:none}.filter .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
.filter.off{background:transparent;color:var(--muted);border-color:var(--line)}.filter.off .sw{background:var(--line)}
.count{opacity:.75}
.btn{font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:2px;padding:4px 12px;cursor:pointer}
.btn:hover{color:var(--fg);border-color:var(--fg)}
.chunk{margin:48px 0;padding-top:8px;border-top:1px solid var(--line)}
.chunk-head{padding:12px 0 4px;margin-bottom:16px}
.chunk-meta{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.chunk h2{font-size:24px;line-height:1.2;margin:4px 0 8px;max-width:40ch}
.chunk-sum{margin:0;color:var(--muted);max-width:65ch}
.row{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:8px 0}
.turn{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px}
.who{font-size:14px;padding-top:1px}.name{font-weight:600;display:block}
.sp-iv .name{color:var(--m)}.sp-ee .name{color:var(--l)}
.ts{color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}
.text{max-width:70ch}
.sp-ee .text{font-weight:450}
mark{background:var(--hl,transparent);color:inherit;border-bottom:2px solid var(--hc,transparent);border-radius:0;padding:0 1px;cursor:pointer}
mark.off{background:transparent;border-bottom-color:transparent;cursor:auto}
.note{border-left:3px solid var(--c);background:var(--soft);border-radius:0;padding:12px 16px;margin-bottom:8px;font-size:14px;line-height:1.5}
.note.hidden{display:none}
.note.flash,mark.flash{outline:2px solid var(--c, var(--fg));outline-offset:2px}
.note-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--c)}
.jump{font-size:12px;color:var(--muted)}
.note-title{font-weight:600;margin:4px 0}
.note blockquote{margin:0 0 8px;padding:0;color:var(--muted);font-style:italic}
.note p{margin:0}
.anchor{position:relative;top:-120px}
footer{color:var(--muted);font-size:14px;padding:24px 0 48px;border-top:1px solid var(--line)}
@media (max-width:900px){.row{grid-template-columns:minmax(0,1fr);gap:6px}.margin{padding-left:0}
.turn{grid-template-columns:minmax(0,1fr);gap:0}.who{display:flex;gap:10px;align-items:baseline}
h1.title{font-size:36px}h2.lead{font-size:24px}.part>.chunk-head h2{font-size:24px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.margin:empty{display:none}.index{grid-template-columns:minmax(0,1fr)}}
@media print{.bar{position:static}}

.notes-layer{display:none}
@media (min-width:901px){
main.transcript{position:relative;padding-right:396px}
.row{grid-template-columns:minmax(0,1fr)}
.margin{display:none}
.notes-layer{display:block;position:absolute;top:0;right:16px;width:356px}
.notes-layer .note{position:absolute;left:0;right:0;margin:0}
}

/* tabs */
.tabs{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px}
.tab{font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.panel{display:none}.panel.active{display:block}
.bar{top:var(--tabs-h,47px)}
body:not(.show-filters) .bar{display:none}
html{scroll-padding-top:calc(var(--tabs-h,47px) + var(--bar-h,0px) + 16px)}
.anchor{top:-150px}
/* notes by theme */
.part{margin:48px 0}
.part>.chunk-head h2{font-size:30px;line-height:1.2;margin:0 0 8px}
.grp{margin:32px 0 8px}
.grp h3{font-size:20px;line-height:1.25;margin:0 0 12px;max-width:60ch}
.grp.empty{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cards .note{margin:0}
/* findings */
.hyps{display:grid;gap:12px;margin:12px 0 32px;max-width:900px}
.hyp{border-left:3px solid var(--sc);background:var(--soft);border-radius:0;padding:16px}
.hyp h3{margin:0 0 4px;font-size:20px;line-height:1.25}
.hyp p{margin:0 0 8px;max-width:65ch}
.status{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--sc)}
.hyp[data-status="supported"]{--sc:var(--job)}.hyp[data-status="contradicted"]{--sc:var(--pain)}.hyp[data-status="open"]{--sc:var(--muted)}
.nq{margin:12px 0 32px;padding-left:24px;max-width:65ch}.nq li{margin:16px 0}.nq .q{font-weight:600}.nq p{margin:4px 0 8px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.chips .lbl{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--c);background:var(--cb);color:var(--c);border-radius:2px;padding:1px 8px;text-decoration:none}
.chip .dot{width:7px;height:7px}
.caveat{border-left:3px solid var(--accent);background:var(--warm);padding:12px 16px;border-radius:0;margin:16px 0;max-width:75ch}
@media (max-width:900px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:500px){.tab{padding:8px 6px;font-size:12px;letter-spacing:.04em}.tabs .wrap{flex-wrap:wrap;overflow-x:visible;gap:0 4px;padding-top:4px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div id="app"></div>
<script type="application/json" id="report-data">null</script>
<script>// Renders the report from the JSON in #report-data. Data contract: references/data-format.md.
const TYPES=['job','pain','workaround','signal','play-good','play-distort','play-missed'];
const EVIDENCE=new Set(['job','pain','workaround','signal']);
const PART_TYPES={interviewee:EVIDENCE,interviewer:new Set(['play-good','play-distort','play-missed'])};
const UI={
pl:{types:['Zadanie','Problem','Obecne rozwiązanie','Sygnał','Dobry ruch','Zniekształcenie','Utracona okazja'],
status:{supported:'Potwierdzona',contradicted:'Obalona',open:'Otwarta'},
tabs:['Przegląd','Transkrypt','Notatki według tematów','Wnioski'],
min:'min',turns:'wypowiedzi',notes:'notatek',part:'Część',topics:'Tematy rozmowy',by_type:'Wszystkie notatki według typu',
show:'Pokaż:',all:'Wszystkie',none:'Żadne',jump:'Przejdź do cytatu',in_tr:'w transkrypcie',hyp:'Hipotezy',
next:'Pytania na następną rozmowę',evidence:'Dowody:',sources:'Z rozmowy:',
problems:'Problemy w danych raportu. Te notatki nie są pokazane:',
empty:'Brak danych. Wstaw JSON {"turns": [...], "report": {...}} w miejsce null w <script id="report-data">. Format: references/data-format.md.',
footer:'Transkrypt: automatyczna transkrypcja, scalona w wypowiedzi, bez zmian w brzmieniu. Cytaty w notatkach to dokładny tekst transkryptu. Nagłówki, notatki i wnioski to interpretacja autora.'},
en:{types:['Job','Pain','Current workaround','Signal','Good move','Distortion','Missed opportunity'],
status:{supported:'Supported',contradicted:'Contradicted',open:'Open'},
tabs:['Overview','Transcript','Notes by theme','Findings'],
min:'min',turns:'turns',notes:'notes',part:'Part',topics:'Topics',by_type:'All notes by type',
show:'Show:',all:'All',none:'None',jump:'Go to quote',in_tr:'in transcript',hyp:'Hypotheses',
next:'Questions for the next interview',evidence:'Evidence:',sources:'From the call:',
problems:'Problems in the report data. These notes are not shown:',
empty:'No data. Put JSON {"turns": [...], "report": {...}} in place of null in the #report-data script tag. Format: references/data-format.md.',
footer:'Transcript: automatic transcription merged into turns, wording unchanged. Note quotes are exact transcript text. Headings, notes and findings are the author\'s interpretation.'}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c]));

function render(data){
  if(!data||!data.turns||!data.report)return{title:'Report',lang:'pl',store:'dir-empty',html:'<div class="wrap empty"><p>'+esc(UI.pl.empty)+'</p><p>'+esc(UI.en.empty)+'</p></div>'};
  const turns=data.turns,rep=data.report,meta=rep.meta||{};
  const lang=UI[meta.lang]?meta.lang:'pl',L=UI[lang];
  const LABEL={};TYPES.forEach((k,i)=>LABEL[k]=L.types[i]);
  const speakers=meta.speakers||{};
  const byId={},order={};turns.forEach((t,i)=>{byId[t.id]=t;order[t.id]=i});
  // Check each note in the browser too, so a report built without the script shows its problems.
  const problems=[],notes=[];
  (rep.notes||[]).forEach(n0=>{
    const n=Object.assign({},n0),t=byId[n.turn];
    if(!TYPES.includes(n.type)){problems.push(n.id+': bad type '+n.type);return}
    if(!t){problems.push(n.id+': no turn '+n.turn);return}
    n.pos=t.text.indexOf(n.quote);
    if(!n.quote||n.pos<0){problems.push(n.id+' '+t.id+': quote not found: "'+n.quote+'"');return}
    notes.push(n);
  });
  const nmap={};notes.forEach(n=>nmap[n.id]=n);
  const counts={};TYPES.forEach(k=>counts[k]=notes.filter(n=>n.type===k).length);
  const byTurn={};notes.forEach(n=>(byTurn[n.turn]=byTurn[n.turn]||[]).push(n));
  Object.values(byTurn).forEach(l=>l.sort((a,b)=>a.pos-b.pos));

  function text(t){
    const ns=byTurn[t.id]||[],s=t.text;
    if(!ns.length)return esc(s);
    const b=[...new Set([0,s.length,...ns.map(n=>n.pos),...ns.map(n=>n.pos+n.quote.length)])].sort((x,y)=>x-y);
    const out=[],started=new Set();
    for(let i=0;i<b.length-1;i++){
      const a=b[i],e=b[i+1],seg=s.slice(a,e);
      const cover=ns.filter(n=>n.pos<=a&&n.pos+n.quote.length>=e);
      if(!cover.length){out.push(esc(seg));continue}
      let anchors='';
      cover.forEach(n=>{if(!started.has(n.id)){started.add(n.id);anchors+='<span class="anchor" id="q-'+esc(n.id)+'"></span>'}});
      out.push(anchors+'<mark data-notes="'+cover.map(n=>esc(n.id)).join(' ')+'" data-types="'+cover.map(n=>n.type).join(' ')+'">'+esc(seg)+'</mark>');
    }
    return out.join('');
  }
  function card(n,g,link){
    return '<aside class="'+(g?'note gnote':'note')+'" data-type="'+n.type+'" id="'+(g?'g-':'')+esc(n.id)+'" data-nid="'+esc(n.id)+'">'
      +'<div class="note-head"><span class="tag">'+LABEL[n.type]+'</span><a class="jump" href="#q-'+esc(n.id)+'" title="'+L.jump+'">'+esc(link||n.turn)+'</a></div>'
      +'<div class="note-title">'+esc(n.title)+'</div><blockquote>„'+esc(n.quote)+'”</blockquote><p>'+esc(n.text)+'</p></aside>';
  }

  const secs=rep.sections||[],secAt={};secs.forEach((s,i)=>secAt[s.start]=[i,s]);
  const body=[];
  turns.forEach(t=>{
    if(secAt[t.id]){const[i,s]=secAt[t.id];if(i)body.push('</section>');
      body.push('<section class="chunk" id="s'+(i+1)+'"><header class="chunk-head"><div class="chunk-meta">'+L.part+' '+(i+1)+(t.ts?' · '+esc(t.ts):'')+'</div>'
        +'<h2>'+esc(s.title)+'</h2><p class="chunk-sum">'+esc(s.summary)+'</p></header>')}
    const sp=speakers[t.sp]||{name:t.sp};
    body.push('<div class="row" id="'+esc(t.id)+'"><div class="turn '+(sp.role==='interviewer'?'sp-iv':'sp-ee')+'"><div class="who"><span class="name">'+esc(sp.name)+'</span>'
      +(t.ts?'<a class="ts" href="#'+esc(t.id)+'">'+esc(t.ts)+'</a>':'')+'</div><div class="text">'+text(t)+'</div></div><div class="margin">'
      +(byTurn[t.id]||[]).map(n=>card(n)).join('')+'</div></div>');
  });
  if(secs.length)body.push('</section>');

  const shown=TYPES.filter(k=>counts[k]);
  const filters=shown.map(k=>'<label class="filter" data-type="'+k+'"><span class="sw"></span>'+LABEL[k]+' <span class="count">'+counts[k]+'</span></label>').join('');
  const index=shown.map(k=>'<div class="ix-col" data-type="'+k+'"><h3><span class="dot"></span>'+LABEL[k]+' ('+counts[k]+')</h3><ul>'
    +notes.filter(n=>n.type===k).sort((a,b)=>order[a.turn]-order[b.turn]||a.pos-b.pos)
      .map(n=>'<li><a href="#q-'+esc(n.id)+'">'+esc(n.title)+'</a> <span class="ix-t">'+esc(n.turn)+'</span></li>').join('')+'</ul></div>').join('');
  const toc=secs.map((s,i)=>{const t=byId[s.start]||{};return '<li><a href="#s'+(i+1)+'">'+(t.ts?'<span class="toc-ts">'+esc(t.ts)+'</span>':'')+esc(s.title)+'</a></li>'}).join('');
  const stats=TYPES.map(k=>'<div class="stat'+(counts[k]?'':' zero')+'" data-type="'+k+'"><b>'+counts[k]+'</b><span>'+LABEL[k]+'</span></div>').join('');
  const sum=rep.summary||{},points=(sum.points||[]).map(p=>'<li>'+esc(p)+'</li>').join('');

  const rank={};TYPES.forEach((k,i)=>rank[k]=i);
  const grp=rep.groups||{};
  const parts=(grp.parts||[]).map(p=>'<section class="part" id="part-'+esc(p.id)+'"><header class="chunk-head"><h2>'+esc(p.title)+'</h2><p class="chunk-sum">'+esc(p.intro)+'</p></header>'
    +(p.groups||[]).map((g,gi)=>{
      const ns=(g.notes||[]).filter(x=>{if(nmap[x])return true;if(!(rep.notes||[]).some(n=>n.id===x))problems.push('group note '+x+' does not exist');return false})
        .map(x=>nmap[x]).sort((a,b)=>rank[a.type]-rank[b.type]||order[a.turn]-order[b.turn]);
      return '<div class="grp" id="'+esc(p.id)+'-'+(gi+1)+'"><h3>'+esc(g.title)+'</h3><div class="cards">'+ns.map(n=>card(n,true,n.turn+' '+L.in_tr)).join('')+'</div></div>'}).join('')
    +'</section>').join('');

  const chips=(ids,lbl)=>{ids=(ids||[]).filter(s=>nmap[s]);if(!ids.length)return '';
    return '<div class="chips"><span class="lbl">'+lbl+'</span>'+ids.map(s=>'<a class="chip" data-type="'+nmap[s].type+'" href="#q-'+esc(s)+'" title="'+esc(nmap[s].title)+'"><span class="dot"></span>'+LABEL[nmap[s].type]+' · '+esc(nmap[s].turn)+'</a>').join('')+'</div>'};
  const f=rep.findings||{};
  const hyps=(f.hypotheses||[]).map(h=>'<article class="hyp" data-status="'+esc(h.status)+'"><div class="status">'+esc(L.status[h.status]||h.status)+'</div><h3>'+esc(h.claim)+'</h3><p>'+esc(h.comment)+'</p>'+chips(h.evidence,L.evidence)+'</article>').join('');
  const nqs=(f.next_questions||[]).map(q=>'<li><div class="q">'+esc(q.question)+'</div><p>'+esc(q.why)+'</p>'+chips(q.sources,L.sources)+'</li>').join('');
  const caveat=f.caveat?'<div class="caveat">'+esc(f.caveat)+'</div>':'';

  const sub=[meta.date||'',meta.duration_min?Math.round(meta.duration_min)+' '+L.min:'',Object.values(speakers).map(s=>esc(s.name)).join(', '),
    turns.length+' '+L.turns,notes.length+' '+L.notes].filter(Boolean).join(' · ');
  const tabbar=['overview','transcript','themes','findings'].map((k,i)=>'<button class="tab" role="tab" data-tab="'+k+'">'+L.tabs[i]+'</button>').join('');
  const warn=problems.length?'<div class="wrap"><div class="problems"><b>'+L.problems+'</b><ul>'+problems.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div></div>':'';
  const title=meta.title||'Report';

  const html='<header class="top"><div class="wrap"><div class="eyebrow">'+esc(meta.eyebrow)+'</div><h1 class="title">'+esc(title)+'</h1><p class="sub">'+sub+'</p></div></header>'
  +warn+'<nav class="tabs"><div class="wrap" role="tablist">'+tabbar+'</div></nav>'
  +'<nav class="bar"><div class="wrap"><span class="lbl">'+L.show+'</span>'+filters+'<button class="btn" id="all">'+L.all+'</button><button class="btn" id="none">'+L.none+'</button></div></nav>'
  +'<section class="panel" id="tab-overview"><div class="wrap"><h2 class="lead">'+esc(sum.headline)+'</h2><ul class="points">'+points+'</ul><div class="stats">'+stats+'</div>'
  +'<h3 class="sect">'+L.topics+' ('+secs.length+')</h3><ol class="toc">'+toc+'</ol></div></section>'
  +'<section class="panel" id="tab-transcript"><main class="wrap transcript">'+body.join('')+'<div class="notes-layer"></div></main></section>'
  +'<section class="panel" id="tab-themes"><div class="wrap"><h2 class="lead">'+esc(grp.headline)+'</h2><details class="box"><summary>'+L.by_type+'</summary><div class="index">'+index+'</div></details>'+parts+'</div></section>'
  +'<section class="panel" id="tab-findings"><div class="wrap"><h2 class="lead">'+esc(f.headline)+'</h2>'+caveat
  +'<h3 class="sect">'+L.hyp+'</h3><div class="hyps">'+hyps+'</div><h3 class="sect">'+L.next+'</h3><ol class="nq">'+nqs+'</ol></div></section>'
  +'<footer class="wrap">'+esc(meta.footer||L.footer)+'</footer>';
  const store='dir-'+[...title].filter(c=>/[\p{L}\p{N}]/u.test(c)).join('').slice(0,40);
  return{title,lang,store,html};
}

// Page behavior: tabs, filters, margin notes.
function boot(){
  const slot=document.getElementById('report-data');
  let data=null;try{data=JSON.parse(slot.textContent)}catch(e){}
  const r=render(data);
  document.title=r.title;document.documentElement.lang=r.lang;
  const app=document.getElementById('app');app.innerHTML=r.html;
  if(!data)return;
  const STORE=r.store;
  const off=new Set();
  const WIDE=window.matchMedia('(min-width:901px)');
  const tmain=document.querySelector('main.transcript');
  const tnotes=tmain?[...tmain.querySelectorAll('.margin .note')]:[];
  tnotes.forEach(n=>n._home=n.parentElement);
  function layoutNotes(){
    if(!tmain)return;
    const layer=tmain.querySelector('.notes-layer');
    if(!WIDE.matches){
      tnotes.forEach(n=>{if(n.parentElement!==n._home){n._home.appendChild(n);n.style.top=''}});
      tmain.style.minHeight='';return;
    }
    if(!tmain.offsetParent)return;
    const base=tmain.getBoundingClientRect().top;
    const items=[];
    tnotes.forEach(n=>{
      if(n.parentElement!==layer)layer.appendChild(n);
      if(n.classList.contains('hidden'))return;
      const m=tmain.querySelector('mark[data-notes~="'+n.dataset.nid+'"]');
      items.push({n,want:m.getBoundingClientRect().top-base-8});
    });
    items.sort((a,b)=>a.want-b.want);
    let y=0;
    items.forEach(it=>{const top=Math.max(it.want,y);it.n.style.top=top+'px';y=top+it.n.offsetHeight+8;});
    tmain.style.minHeight='';
    if(y>tmain.offsetHeight)tmain.style.minHeight=y+'px';
  }
  let _lt;window.addEventListener('resize',()=>{clearTimeout(_lt);_lt=setTimeout(layoutNotes,100)});
  window.addEventListener('load',layoutNotes);
  if(document.fonts)document.fonts.ready.then(layoutNotes);

  function apply(){
    document.querySelectorAll('.filter').forEach(f=>f.classList.toggle('off',off.has(f.dataset.type)));
    document.querySelectorAll('.note').forEach(n=>n.classList.toggle('hidden',off.has(n.dataset.type)));
    document.querySelectorAll('.ix-col').forEach(c=>c.style.display=off.has(c.dataset.type)?'none':'');
    document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('empty',!g.querySelector('.note:not(.hidden)')));
    document.querySelectorAll('mark').forEach(m=>{
      const vis=m.dataset.types.split(' ').filter(t=>!off.has(t));
      if(!vis.length){m.classList.add('off');m.style.removeProperty('--hl');m.style.removeProperty('--hc');return;}
      m.classList.remove('off');
      m.style.setProperty('--hl','var(--'+vis[0]+'-bg)');
      m.style.setProperty('--hc','var(--'+vis[0]+')');
      m.dataset.type=vis[0];
    });
    try{localStorage.setItem(STORE+'-off',JSON.stringify([...off]))}catch(e){}
    layoutNotes();
  }
  try{JSON.parse(localStorage.getItem(STORE+'-off')||'[]').forEach(t=>off.add(t))}catch(e){}
  document.querySelectorAll('.filter').forEach(f=>f.addEventListener('click',e=>{
    e.preventDefault();const t=f.dataset.type;off.has(t)?off.delete(t):off.add(t);apply();
  }));
  document.getElementById('all').onclick=()=>{off.clear();apply()};
  document.getElementById('none').onclick=()=>{TYPES.forEach(t=>off.add(t));apply()};

  function flash(el){if(!el)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}
  document.addEventListener('click',e=>{
    const m=e.target.closest('mark');
    if(m&&!m.classList.contains('off')){
      const ids=m.dataset.notes.split(' ').filter(id=>!off.has(document.getElementById(id).dataset.type));
      ids.forEach(id=>flash(document.getElementById(id)));
      const first=document.getElementById(ids[0]);
      if(first&&window.innerWidth<=900)first.scrollIntoView({behavior:'smooth',block:'center'});
    }
    const a=e.target.closest('a[href^="#q-"]');
    if(a){const nid=a.getAttribute('href').slice(3);
      const mk=document.querySelector('mark[data-notes~="'+nid+'"]');
      setTimeout(()=>{flash(mk);flash(document.getElementById(nid))},300);}
  });

  const FILTER_TABS=new Set(['transcript','themes']);
  function syncBars(){
    const r=document.documentElement.style,tabs=document.querySelector('.tabs'),bar=document.querySelector('.bar');
    if(tabs)r.setProperty('--tabs-h',tabs.offsetHeight+'px');
    r.setProperty('--bar-h',(bar&&bar.offsetParent?bar.offsetHeight:0)+'px');
  }
  window.addEventListener('resize',syncBars);
  function showTab(k,keepScroll){
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===k));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+k));
    document.body.classList.toggle('show-filters',FILTER_TABS.has(k));
    try{localStorage.setItem(STORE+'-tab',k)}catch(e){}
    syncBars();
    layoutNotes();
    if(!keepScroll)window.scrollTo(0,0);
  }
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
  document.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#"]');if(!a)return;
    const id=a.getAttribute('href').slice(1);const el=document.getElementById(id);if(!el)return;
    const panel=el.closest('.panel');if(!panel)return;
    e.preventDefault();
    showTab(panel.id.slice(4),true);
    requestAnimationFrame(()=>el.scrollIntoView({block:id.startsWith('q-')?'center':'start'}));
  },true);
  let start='overview';try{start=localStorage.getItem(STORE+'-tab')||'overview'}catch(e){}
  if(!document.getElementById('tab-'+start))start='overview';
  showTab(start);apply();
}
if(typeof module!=='undefined')module.exports={render};else boot();
</script></body></html>
